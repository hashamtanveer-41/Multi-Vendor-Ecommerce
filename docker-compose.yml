services:
  # MongoDB Database Service
  mongodb:
    image: mongo:6.0
    container_name: eshop_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - eshop-network

  # Backend REST API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: eshop_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - NODE_ENV=production
      - PORT=8000
      - DB_URL=mongodb://mongodb:27017/eshop
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-eshop_jwt_super_secret_key_12345}
      - JWT_EXPIRES=7d
      - ACTIVATION_SECRET=${ACTIVATION_SECRET:-eshop_activation_super_secret_key_12345}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - STRIPE_API_KEY=${STRIPE_API_KEY:-pk_test_sample}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-sk_test_sample}
      - CLOUDINARY_NAME=${CLOUDINARY_NAME:-du56lo8vn}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY:-486867354696844}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET:-duj0sSjfpcl9nk1mlZMPEFMSg7U}
      - SMPT_HOST=${SMPT_HOST:-smtp.gmail.com}
      - SMPT_PORT=${SMPT_PORT:-465}
      - SMPT_SERVICE=${SMPT_SERVICE:-gmail}
      - SMPT_MAIL=${SMPT_MAIL:-""}
      - SMPT_PASSWORD=${SMPT_PASSWORD:-""}
    depends_on:
      - mongodb
    networks:
      - eshop-network

  # Socket.IO Real-time Messaging Service
  socket:
    build:
      context: ./socket
      dockerfile: Dockerfile
    container_name: eshop_socket
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
    networks:
      - eshop-network

  # React Frontend Client (Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - REACT_APP_SERVER_URL=${REACT_APP_SERVER_URL:-http://localhost:8000/api/v2}
        - REACT_APP_BACKEND_URL=${REACT_APP_BACKEND_URL:-http://localhost:8000/}
        - REACT_APP_SOCKET_URL=${REACT_APP_SOCKET_URL:-http://localhost:4000/}
    container_name: eshop_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
      - socket
    networks:
      - eshop-network

networks:
  eshop-network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
